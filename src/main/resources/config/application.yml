# Shared rules and infrastructure. Each service still owns its own MongoDB database name.
bank:
  security:
    jwt-secret: bank-bootcamp-demo-secret-change-me
    jwt-expiration-minutes: 120
    bootstrap-username: admin
    bootstrap-password: admin123
  savings:
    maintenance-fee: 0
    max-movements-per-month: 10
    minimum-opening-amount: 0
  checking:
    maintenance-fee: 12.00
    minimum-opening-amount: 0
  fixed-term:
    maintenance-fee: 0
    minimum-opening-amount: 0
  transactions:
    free-per-month: 5
    commission-amount: 1.50
  vip:
    minimum-daily-average: 500.00
    shortfall-penalty: 10.00
  pyme:
    maintenance-fee: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

resilience4j:
  circuitbreaker:
    instances:
      customer:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      credit:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
  timelimiter:
    instances:
      customer:
        timeoutDuration: 2s
        cancelRunningFuture: true
      credit:
        timeoutDuration: 2s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.nttdata.bank: DEBUG
    org.springframework.data.mongodb: INFO
    org.mongodb: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true
